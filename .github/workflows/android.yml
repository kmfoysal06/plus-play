name: Android build and release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          version_name="$(sed -n 's/^[[:space:]]*versionName[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle)"
          if [ -z "$version_name" ]; then
            echo 'Could not read versionName from app/build.gradle' >&2
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version_name" ]; then
            echo "Tag $GITHUB_REF_NAME does not match app version v$version_name" >&2
            exit 1
          fi
          echo "VERSION_NAME=$version_name" >> "$GITHUB_ENV"

      - name: Build unsigned release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Restore release keystore
        if: github.ref_type == 'tag'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?KEYSTORE_BASE64 secret is required}"
          : "${KEYSTORE_PASSWORD:?KEYSTORE_PASSWORD secret is required}"
          : "${KEY_ALIAS:?KEY_ALIAS secret is required}"
          : "${KEY_PASSWORD:?KEY_PASSWORD secret is required}"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Sign and verify APK with build-tools 34
        if: github.ref_type == 'tag'
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          apksigner="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          test -x "$apksigner"
          unsigned_apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          signed_apk="app/build/outputs/apk/release/plus-play-signed.apk"
          "$apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$signed_apk" \
            "$unsigned_apk"
          "$apksigner" verify --verbose --print-certs "$signed_apk"

      - name: Upload APK artifact
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: plus-play-${{ env.VERSION_NAME }}
          path: app/build/outputs/apk/release/plus-play-signed.apk

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/plus-play-signed.apk
          generate_release_notes: true
